<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arta's World</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="stylesheet" href="styles.css">
    
    <!-- Standard Meta Tags -->
    <meta name="description" content="Explore the professional portfolio and projects of Arta Seyedian.">
    <meta name="author" content="Arta Seyedian">
    <meta name="keywords" content="portfolio, 3D, web development, Arta Seyedian">

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Arta Seyedian's Website">
    <meta property="og:description" content="Discover the work and accomplishments of Arta Seyedian.">
    <meta property="og:url" content="https://artaseyedian.com">
    <meta property="og:type" content="website">
    <!-- Add an og:image when you have a representative image for your site -->
    <meta property="og:image" content="https://artaseyedian.com/arta-headshot-preview.png">
    <!-- <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630"> -->
    <meta property="og:image:alt" content="Headshot of Arta Seyedian">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Arta Seyedian's Website">
    <meta name="twitter:description" content="Discover the work and accomplishments of Arta Seyedian.">
    <!-- Add a twitter:image when you have a representative image for your site -->
    <meta name="twitter:image" content="https://artaseyedian.com/arta-headshot-preview.png">
    <meta property="twitter:image" content="https://artaseyedian.com/arta-headshot-preview.png">
    <!-- <meta property="twitter:image:width" content="1200">
    <meta property="twitter:image:height" content="630"> -->
    <meta property="twitter:image:alt" content="Headshot of Arta Seyedian">

    <!-- Preload critical assets (audio is lazy-loaded after first render, no preload) -->
    <link rel="preload" href="./hdr/ocean_hdri/001/001.hdr" as="fetch" crossorigin="anonymous">
    <link rel="preload" href="./textures/waternormals.jpg" as="image">
    <link rel="preload" href="./fonts/helvetiker_regular.typeface.json" as="fetch" crossorigin="anonymous">


    <style>
        @font-face {
            font-family: 'Lalezar';
            src: url('./fonts/Lalezar-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        #loadingScreen {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        #loadingText {
            margin-bottom: 20px;
        }
        #loadingBarContainer {
            width: 80%;
            height: 20px;
            background-color: #444;
            border-radius: 10px;
            overflow: hidden;
        }
        #loadingBar {
            width: 0;
            height: 100%;
            background-color: #0f0;
            border-radius: 10px;
        }
        #lazy-status {
            display: none;
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.55);
            color: rgba(255, 255, 255, 0.8);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-family: monospace;
            z-index: 100;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }

        #music-toggle {
            position: fixed;
            right: 12px;
            bottom: 14px;
            display: none;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 0, 0.35);
            border-radius: 20px;
            color: #ff0;
            font-family: monospace;
            font-size: 12px;
            padding: 7px 14px;
            z-index: 100;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }
        #music-toggle.ready { display: flex; }
        #music-toggle:hover { border-color: #ff0; }
        #music-toggle .eq {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 12px;
        }
        #music-toggle .eq i {
            width: 3px;
            height: 3px;
            background: #ff0;
            border-radius: 1px;
        }
        #music-toggle.playing .eq i {
            animation: eq-bounce 0.9s ease-in-out infinite;
        }
        #music-toggle.playing .eq i:nth-child(2) { animation-delay: 0.25s; }
        #music-toggle.playing .eq i:nth-child(3) { animation-delay: 0.5s; }
        @keyframes eq-bounce {
            0%, 100% { height: 3px; }
            50% { height: 12px; }
        }

        /* inside-a-cloud screen wash — opacity driven per-frame from JS */
        #cloud-wash {
            position: fixed;
            inset: 0;
            background: rgb(255, 255, 255);
            opacity: 0;
            pointer-events: none;
            z-index: 1;
        }

        #flight-hint {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 0, 0.35);
            border-radius: 20px;
            color: #ff0;
            font-family: monospace;
            font-size: 12px;
            padding: 7px 14px;
            z-index: 100;
            pointer-events: none;
        }
        #flight-hint.active { display: block; }

        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            margin: -2px 0 0 -2px;
            border-radius: 50%;
            background: rgba(255, 255, 0, 0.8);
            display: none;
            z-index: 100;
            pointer-events: none;
        }
        #crosshair.active { display: block; }

        .dancer-bubble {
            position: fixed;
            display: none;
            transform: translate(-50%, -100%);
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 0, 0.35);
            border-radius: 20px;
            color: #ff0;
            font-family: monospace;
            font-size: 12px;
            padding: 7px 14px;
            max-width: 80ch; /* ch = one monospace character's width, so this wraps ~80 chars/line */
            white-space: normal;
            text-align: center;
            pointer-events: none;
            z-index: 100;
        }

        .dancer-choice {
            position: fixed;
            display: none;
            transform: translate(-50%, 12px);
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 100;
        }
        .dancer-choice-dismiss,
        .dancer-choice-input {
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 0, 0.35);
            border-radius: 20px;
            color: #ff0;
            font-family: monospace;
            font-size: 12px;
            padding: 5px 14px;
        }
        .dancer-choice-dismiss {
            cursor: pointer;
        }
        .dancer-choice-dismiss:hover,
        .dancer-choice-input:focus {
            border-color: #ff0;
        }
        .dancer-choice-input {
            width: 220px;
            outline: none;
        }
        .dancer-choice-input::placeholder {
            color: rgba(255, 255, 0, 0.5);
        }

        /* photo mode: strip HUD for a clean capture */
        body.photo-mode .lil-gui,
        body.photo-mode #music-toggle,
        body.photo-mode #stats-panel {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="loadingScreen">
        <div id="loadingText">Loading...</div>
        <div id="loadingBarContainer">
            <div id="loadingBar"></div>
        </div>
    </div>
    <div id="lazy-status"></div>
    <div id="cloud-wash"></div>
    <div id="flight-hint">WASD fly &middot; space/c up/down &middot; shift boost &middot; scroll speed &middot; h home &middot; esc exit</div>
    <div id="crosshair"></div>
    <button id="music-toggle" aria-label="Toggle music" title="Fresh and Clean — OutKast">
        <span class="eq"><i></i><i></i><i></i></span>
        <span class="label">play music</span>
    </button>

    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            const loadingScreen = document.getElementById('loadingScreen');
            const loadingBar = document.getElementById('loadingBar');
            const loadingText = document.getElementById('loadingText');

            function updateLoadingBar(progress) {
                loadingBar.style.width = `${progress}%`;
                loadingText.innerText = `Loading... ${progress}%`;
            }

            function loadAssets(callback) {
                let progress = 0;
                const interval = setInterval(() => {
                    progress += 10;
                    updateLoadingBar(progress);
                    if (progress >= 100) {
                        clearInterval(interval);
                        callback();
                    }
                }, 200); // Simulate loading time
            }

            loadAssets(() => {});
        });
    </script>

    <script type="module" src="/main.js"></script>
</body>
</html>
